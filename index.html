              <img class="turn__img turn__img--colour" alt="" decoding="async" data-turn-img="colour">

      function get(path) {

      }
      function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
      each("[data-c]", function (el) { var v = get(el.getAttribute("data-c")); if (typeof v === "string") el.textContent = v; });
      each("[data-c-alt]", function (el) { var v = get(el.getAttribute("data-c-alt")); if (typeof v === "string") el.alt = v; });
      each("[data-c-aria]", function (el) { var v = get(el.getAttribute("data-c-aria")); if (typeof v === "string") el.setAttribute("aria-label", v); });
